title: ClickFix Kampagnen-Infrastruktur - Netzwerkkontakt
id: 8e40b6d2-1c73-4f95-a3d8-6b25f0c7ae14
status: experimental
description: Kontakt zu bekannter Stage-1-/Stage-2-Infrastruktur der ClickFix-Kampagne vom 2026-08-04.
author: Novum Analytica GmbH
date: 2026-08-04
logsource:
