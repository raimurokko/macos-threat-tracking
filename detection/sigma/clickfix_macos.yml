title: ClickFix Stage-2 - Proxy/Web-Request auf Loader-Pfad
id: 2a9d5b81-7e36-40c2-9f14-c8b3d6e05a77
status: experimental
description: HTTP(S)-Request auf die bekannten Stage-1-/Stage-2-URLs der Kampagne.
author: Novum Analytica GmbH
date: 2026-08-04
logsource:
    category: proxy
detection:
    selection_host:
        c-uri|contains:
            - 'enter-pverif-code.info/p/'
            - 'ferncurrent14.com/curl/'
    selection_token:
        c-uri|contains:
            - 'b143d2530595a6b8a52694418e2edbe35405383d15e3397923ce0c747c25cfab'
            - 'a7ec41c89a3dc6bf3de47264b4a3013134c7273dd1aa379859c2149b7517f0b2'
    selection_ua:
        cs-user-agent|startswith: 'curl/'
        c-uri|contains: '/curl/'
    condition: 1 of selection_*
fields:
    - c-uri
    - cs-user-agent
    - src_ip
falsepositives:
    - Keine bekannt
level: critical
tags:
    - attack.command_and_control
    - attack.t1105
