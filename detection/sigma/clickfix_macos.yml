title: macOS ClickFix - Terminal-Ausfuehrung eines Clipboard-Loaders
id: 5c1f3a7e-9b24-4d61-8a0f-2e7c41d9b3f8
status: experimental
description: >
  Erkennt das ClickFix-Ausfuehrungsmuster auf macOS: Der Nutzer fuegt ein
  obfuskiertes Shell-Kommando aus der Zwischenablage in Terminal.app ein.
  Charakteristisch ist ein eval ueber ein base64-dekodiertes printf/echo,
  gefolgt vom Nachladen einer zweiten Stufe per curl direkt in eine Shell.
author: Novum Analytica GmbH
date: 2026-08-04
references:
    - https://attack.mitre.org/techniques/T1204/004/
    - https://www.ncsc.admin.ch/ncsc/en/home/aktuell/im-fokus/2026/wochenrueckblick_8.html
logsource:
    category: process_creation
    product: macos
detection:
    selection_eval_b64:
        CommandLine|contains:
            - 'eval "$(printf'
            - 'eval $(printf'
            - 'eval "$(echo'
        CommandLine|contains|all:
            - 'base64'
            - '-d'
    selection_openssl_b64:
        CommandLine|contains: 'openssl base64 -d -A'
    selection_curl_to_shell:
        CommandLine|contains:
            - 'curl -s'
            - 'curl -fsSL'
            - 'curl -sL'
        CommandLine|contains|all:
            - '|'
        CommandLine|re: '\|\s*(z|ba)?sh\b'
    parent_interactive:
        ParentImage|endswith:
            - '/Terminal'
            - '/iTerm2'
            - '/zsh'
            - '/bash'
    filter_devtools:
        CommandLine|contains:
            - '/usr/local/Homebrew/'
            - '.git/hooks/'
            - '/opt/homebrew/Library/'
    condition: (selection_eval_b64 or selection_openssl_b64 or (selection_curl_to_shell and parent_interactive)) and not filter_devtools
fields:
    - CommandLine
    - ParentImage
    - User
falsepositives:
    - Entwickler-Bootstrapper und Installationsskripte (Homebrew, rustup, nvm)
    - Interne Provisionierungsskripte
level: high
tags:
    - attack.execution
    - attack.t1204.004
    - attack.t1059.004
    - attack.defense_evasion
    - attack.t1027.013
